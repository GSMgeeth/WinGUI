[package]
name = "wingui"
version = "0.1.0"
description = "Headless-server companion for Cambio environments: files, services and JBoss tools over WinRM"
authors = ["CuriouserLabs"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "wingui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# Win32 APIs (Credential Manager, Job Objects) — only ever used behind
# `#[cfg(windows)]`, so the platform-neutral core still compiles and tests on a
# Linux CI runner.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
